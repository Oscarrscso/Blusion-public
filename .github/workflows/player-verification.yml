name: Player verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/player-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop earlier player verification runs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'player-verification.yml', per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.run_number < context.runNumber && run.status !== 'completed') {
                try {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                  core.info('Cancelled superseded run ' + run.id);
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }
  player:
    # Automatic builds are paused. Only an explicit manual dispatch runs checks.
    if: github.event_name == 'workflow_dispatch'
    needs: cancel-superseded
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fallback: ['0', '1']
        phase: ['release', 'simulator']
    steps:
      - uses: actions/checkout@v4
      - name: Install build and fixture tools
        run: brew install xcodegen ffmpeg
      - name: Record SDK and simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Player logic regressions
        if: matrix.phase == 'simulator'
        run: |
          swift test --package-path Packages/PlayerKit --filter 'FallbackEngineTests|SubtitleServiceTests|VideoGeometryTests'
          swift test --package-path Packages/Features --filter 'PlayerTrackPresentationTests|PlayerFeatureTests|PlayerViewModelTests|StreamPickerViewModelTests'
      - name: Compile and exercise fresh app
        env:
          FALLBACK: ${{ matrix.fallback }}
          PLAYER_VERIFICATION_PHASE: ${{ matrix.phase }}
        run: bash scripts/verify-player-ui.sh
      - name: Preserve screenshots and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-verification-fallback-${{ matrix.fallback }}-${{ matrix.phase }}
          path: |
            build/player-verification.noindex/*/shots/
            build/player-verification.noindex/*/*.log
            build/player-verification.noindex/*/*.xcresult/
          if-no-files-found: warn
